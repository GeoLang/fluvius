[package]
name = "fluvius-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
kafka = ["dep:rdkafka"]
mqtt = ["dep:rumqttc"]
# only a wss:// websocket feed needs this, a default build talks ws:// and binds listeners
tls = ["tokio-tungstenite/rustls-tls-webpki-roots"]

[dependencies]
fluvius-core = { path = "../fluvius-core" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
thiserror = "2"
# kafka: vendored librdkafka via cmake, curl vendored too so builds
# need no system libs on any os
rdkafka = { version = "0.39", features = ["cmake-build", "curl-static", "tokio"], optional = true }
rumqttc = { version = "0.25", optional = true }

[dev-dependencies]
tempfile = "3"
